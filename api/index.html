<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Job Match Agent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        textarea {
            width: 100%;
            height: 300px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            resize: none;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            display: none;
        }

        .results.show {
            display: block;
        }

        .candidate-profile {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .candidate-profile h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .profile-item {
            margin-bottom: 10px;
            font-size: 0.95em;
        }

        .profile-label {
            font-weight: bold;
            color: #333;
        }

        .profile-value {
            color: #666;
        }

        .job-card {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 5px;
            transition: all 0.3s;
        }

        .job-card:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transform: translateX(5px);
        }

        .job-title {
            font-weight: bold;
            font-size: 1.1em;
            color: #333;
            margin-bottom: 5px;
        }

        .job-company {
            color: #667eea;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .job-score {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .job-explanation {
            color: #666;
            font-size: 0.95em;
            line-height: 1.5;
        }

        .clarifying-question {
            background: #fff3cd;
            border: 2px solid #ffc107;
            border-radius: 5px;
            padding: 20px;
            margin-top: 20px;
        }

        .clarifying-question h3 {
            color: #856404;
            margin-bottom: 10px;
        }

        .clarifying-question p {
            color: #856404;
            font-size: 1.05em;
            line-height: 1.6;
        }

        .error {
            background: #f8d7da;
            border: 2px solid #f5c6cb;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            display: none;
        }

        .error.show {
            display: block;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 1.8em;
            }
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 30px;
            opacity: 0.8;
        }

        .empty-state {
            color: #999;
            text-align: center;
            padding: 40px 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 Smart Job Match Agent</h1>
            <p>Find your perfect job using AI-powered recommendations</p>
        </div>

        <div class="main-content">
            <!-- Input Section -->
            <div class="card">
                <h2>📄 Your Resume</h2>
                <textarea id="resumeText" placeholder="Paste your resume here...

Example:
John Doe
Python developer with 5 years experience in machine learning.
Skills: Python, PyTorch, TensorFlow, SQL, Docker
Education: BS Computer Science
Interested in: ML Engineer, Data Scientist roles"></textarea>
                <div class="button-group">
                    <button class="btn-primary" onclick="analyzeResume()">🚀 Analyze</button>
                    <button class="btn-secondary" onclick="clearInput()">Clear</button>
                </div>
                <div class="error" id="error"></div>
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>Analyzing your resume...</p>
                </div>
            </div>

            <!-- Results Section -->
            <div class="card">
                <h2>✨ Results</h2>
                <div class="empty-state" id="emptyState">
                    <p>Paste your resume and click "Analyze" to see job recommendations</p>
                </div>
                <div class="results" id="results">
                    <div class="candidate-profile" id="candidateProfile"></div>
                    <div id="jobsList"></div>
                    <div class="clarifying-question" id="clarifyingQuestion"></div>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>🚀 100% FREE • NO API Keys • Local Processing • Fast & Reliable</p>
        </div>
    </div>

   <script>
    async function analyzeResume() {

        const resumeText = document
            .getElementById('resumeText')
            .value
            .trim();

        const errorDiv = document.getElementById('error');
        const loadingDiv = document.getElementById('loading');
        const resultsDiv = document.getElementById('results');
        const emptyState = document.getElementById('emptyState');

        // Clear old errors
        errorDiv.classList.remove('show');

        // Validation
        if (!resumeText) {
            showError('Please paste your resume text');
            return;
        }

        if (resumeText.length < 20) {
            showError(
                'Resume text is too short. Please provide more details.'
            );
            return;
        }

        // Show loading
        loadingDiv.style.display = 'block';
        resultsDiv.classList.remove('show');
        emptyState.style.display = 'none';

        try {

            const response = await fetch("/recommend", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    resume_text: resumeText
                })
            });

            // Handle backend errors properly
            if (!response.ok) {

                const errorText = await response.text();

                throw new Error(errorText);
            }

            const data = await response.json();

            displayResults(data);

            resultsDiv.classList.add('show');

        } catch (error) {

            console.error(error);

            showError(
                `Backend Error: ${error.message}`
            );

        } finally {

            loadingDiv.style.display = 'none';
        }
    }

    function displayResults(data) {

        // Candidate profile
        const candidateProfile = `
            <h3>👤 Your Profile</h3>

            <div class="profile-item">
                <span class="profile-label">Name:</span>
                <span class="profile-value">
                    ${data.candidate.name || "Not specified"}
                </span>
            </div>

            <div class="profile-item">
                <span class="profile-label">Experience:</span>
                <span class="profile-value">
                    ${data.candidate.experience_years || 0} years
                </span>
            </div>

            <div class="profile-item">
                <span class="profile-label">Skills:</span>
                <span class="profile-value">
                    ${(data.candidate.skills || []).join(', ') || 'General'}
                </span>
            </div>
        `;

        document.getElementById(
            'candidateProfile'
        ).innerHTML = candidateProfile;

        // Jobs list
        let jobsHTML = `
            <h3>💼 Top Recommended Jobs</h3>
        `;

        data.ranked_jobs.forEach((job, index) => {

            jobsHTML += `
                <div class="job-card">

                    <div class="job-title">
                        ${index + 1}. ${job.title}
                    </div>

                    <div class="job-company">
                        ${job.company}
                    </div>

                    <div class="job-score">
                        Match:
                        ${(job.similarity_score * 100).toFixed(1)}%
                    </div>

                    <div class="job-explanation">
                        ${job.explanation}
                    </div>

                </div>
            `;
        });

        document.getElementById(
            'jobsList'
        ).innerHTML = jobsHTML;

        // Clarifying question
        const questionHTML = `
            <h3>❓ Next Step</h3>

            <p>
                ${data.clarifying_question}
            </p>
        `;

        document.getElementById(
            'clarifyingQuestion'
        ).innerHTML = questionHTML;
    }

    function showError(message) {

        const errorDiv = document.getElementById('error');

        errorDiv.textContent = message;

        errorDiv.classList.add('show');
    }

    function clearInput() {

        document.getElementById('resumeText').value = '';

        document
            .getElementById('results')
            .classList
            .remove('show');

        document.getElementById(
            'emptyState'
        ).style.display = 'block';

        document
            .getElementById('error')
            .classList
            .remove('show');
    }

    // Health check
    window.addEventListener('load', async () => {

        try {

            const response = await fetch("/health");

            if (!response.ok) {
                console.warn('API health check failed');
            }

        } catch (error) {

            console.warn(
                'Could not reach API:',
                error
            );
        }
    });
</script>
</body>
</html>
